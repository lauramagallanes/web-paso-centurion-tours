name: AWS Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: paso-centurion-tours

jobs:
  # Build and test
  build:
    runs-on: ubuntu-latest
    name: Build and Test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: |
        npm run lint
        npm run type-check
        npm test --if-present
        
    - name: Build frontend
      run: npm run build
      
    - name: Upload frontend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: dist/
        retention-days: 1

  # Build backend (when available)
  build-backend:
    runs-on: ubuntu-latest
    name: Build Backend
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'
        
    - name: Build backend
      run: |
        if [ -f "backend/pom.xml" ]; then
          cd backend
          mvn clean package -DskipTests
        else
          echo "Backend not found, creating placeholder"
          mkdir -p backend/target
          echo "Backend not implemented yet" > backend/target/app.jar
        fi
      
    - name: Upload backend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/target/*.jar
        retention-days: 1

  # Deploy to AWS EC2
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to AWS EC2
    needs: [build, build-backend]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend-dist/
        
    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: backend-jar/
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
    - name: Create deployment package
      run: |
        # Create deployment directory
        mkdir -p deployment-package
        
        # Copy artifacts
        cp -r frontend-dist/* deployment-package/
        if [ -f "backend-jar/*.jar" ]; then
          cp backend-jar/*.jar deployment-package/app.jar
        fi
        
        # Copy deployment script
        cp scripts/deploy.sh deployment-package/
        chmod +x deployment-package/deploy.sh
        
        # Create deployment info
        cat > deployment-package/deployment-info.json << EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "actor": "${{ github.actor }}",
          "workflow_run": "${{ github.run_number }}"
        }
        EOF
        
    - name: Upload to S3 (optional backup)
      run: |
        if [ ! -z "${{ secrets.S3_DEPLOYMENT_BUCKET }}" ]; then
          PACKAGE_NAME="paso-centurion-tours-${{ github.sha }}.tar.gz"
          tar -czf $PACKAGE_NAME deployment-package/
          aws s3 cp $PACKAGE_NAME s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/deployments/
        else
          echo "S3_DEPLOYMENT_BUCKET not configured, skipping backup"
        fi
        
    - name: Deploy to EC2
      run: |
        # Transfer deployment package
        scp -i ~/.ssh/id_rsa -r deployment-package/ ec2-user@${{ secrets.EC2_HOST }}:/tmp/
        
        # Execute deployment
        ssh -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          
          # Move to deployment directory
          cd /tmp/deployment-package
          
          # Make deploy script executable
          chmod +x deploy.sh
          
          # Run deployment as root
          sudo ./deploy.sh deploy
          
          # Cleanup
          cd /
          rm -rf /tmp/deployment-package
        EOF
        
    - name: Health check
      run: |
        # Wait for application to start
        sleep 30
        
        # Check if application is responding
        MAX_ATTEMPTS=10
        ATTEMPT=1
        
        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          if curl -f http://${{ secrets.EC2_HOST }}/health; then
            echo "Health check passed on attempt $ATTEMPT"
            break
          else
            echo "Health check failed on attempt $ATTEMPT"
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "Health check failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          fi
        done
        
    - name: Notify deployment success
      run: |
        echo "🚀 Deployment successful!"
        echo "Application URL: http://${{ secrets.EC2_HOST }}"
        echo "Commit: ${{ github.sha }}"
        echo "Deployed by: ${{ github.actor }}"

  # Rollback job (manual trigger)
  rollback:
    runs-on: ubuntu-latest
    name: Rollback Deployment
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'rollback'
    
    steps:
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
    - name: Rollback on EC2
      run: |
        ssh -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          
          # Download and run deployment script for rollback
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          
          # Run rollback
          sudo /tmp/deploy.sh rollback
          
          # Cleanup
          rm -f /tmp/deploy.sh
        EOF
        
    - name: Verify rollback
      run: |
        sleep 10
        curl -f http://${{ secrets.EC2_HOST }}/health
        echo "Rollback completed successfully"
