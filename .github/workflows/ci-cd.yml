name: Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Frontend Testing & Building
  frontend:
    runs-on: ubuntu-latest
    name: Frontend (React)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install frontend dependencies
      run: npm ci
      
    - name: Run frontend linting
      run: npm run lint
      
    - name: Frontend type checking
      run: npm run type-check
      
    - name: Build frontend
      run: npm run build
      
    - name: Upload frontend build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: dist/
        retention-days: 1

  # Backend Testing & Building (cuando lo agregues)
  backend:
    runs-on: ubuntu-latest
    name: Backend (Java Spring Boot)
    needs: frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'
        
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build and test backend
      run: |
        # Asumiendo que el backend estará en una carpeta 'backend' o 'api'
        if [ -f "backend/pom.xml" ]; then
          cd backend
          mvn clean install
          mvn test
        else
          echo "Backend not found, skipping..."
        fi
      
    - name: Upload backend JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/target/*.jar
        retention-days: 1
      if: success()

  # Note: Deployment moved to aws-deploy.yml workflow
  # This workflow now focuses on CI/CD testing and validation
