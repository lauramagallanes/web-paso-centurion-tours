name: Deploy to Development

on:
  push:
    branches: [ development ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: tinambu-frontend-dev
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build frontend
      working-directory: ./frontend
      env:
        VITE_API_BASE_URL: https://53dmek6dqk.execute-api.us-east-1.amazonaws.com
        VITE_ENV: development
        VITE_DEBUG: false
      run: npm run build
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Deploy to S3
      run: |
        aws s3 sync frontend/dist s3://${{ env.S3_BUCKET }} --delete --region ${{ env.AWS_REGION }}
        echo "🚀 Frontend deployed to S3: https://${{ env.S3_BUCKET }}.s3.us-east-1.amazonaws.com/"
        
    - name: Check deployment
      run: |
        echo "✅ Deployment completed!"
        echo "🌐 Frontend URL: https://${{ env.S3_BUCKET }}.s3.us-east-1.amazonaws.com/"
        echo "🎯 Admin Panel: https://${{ env.S3_BUCKET }}.s3.us-east-1.amazonaws.com/admin"
        
        # Test if deployment is accessible
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.S3_BUCKET }}.s3.us-east-1.amazonaws.com/index.html")
        if [ "$HTTP_STATUS" = "200" ]; then
          echo "✅ Deployment verified - Site is accessible!"
        else
          echo "❌ Deployment verification failed - HTTP $HTTP_STATUS"
          exit 1
        fi
