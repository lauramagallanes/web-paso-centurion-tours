name: Deploy Development

on:
  push:
    branches: [development]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  FRONTEND_BUCKET: tinambu-frontend-dev
  ASSETS_BUCKET: tinambu-public-assets-dev
  LAMBDA_FUNCTION: tinambu-tours-backend-dev
  LAMBDA_S3_KEY: lambda/tinambu-tours-lambda-AUTH-ENDPOINTS.jar

jobs:
  # ──────────────────────────────────────────────
  # Detect what changed to avoid unnecessary deploys
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    name: Detect changes
    outputs:
      frontend:  ${{ steps.filter.outputs.frontend }}
      backend:   ${{ steps.filter.outputs.backend }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/src/**'
              - 'backend/pom.xml'
            terraform:
              - 'terraform/environments/dev/**'
              - 'terraform/modules/**'
              - 'terraform/shared/**'

  # ──────────────────────────────────────────────
  # Build and deploy Frontend (React/Vite → S3)
  # ──────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: frontend
        run: aws s3 sync dist/ s3://${{ env.FRONTEND_BUCKET }} --delete

      - name: Summary
        run: |
          echo "### Frontend deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Bucket: \`${{ env.FRONTEND_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Build and deploy Backend (Spring Boot → Lambda)
  # ──────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Build JAR
        working-directory: backend
        run: mvn clean package -DskipTests -q

      - name: Verify JAR exists
        working-directory: backend
        run: |
          JAR_FILE="target/tinambu-tours-lambda.jar"
          if [ ! -f "$JAR_FILE" ]; then
            echo "::error::JAR not found: $JAR_FILE"
            exit 1
          fi
          echo "JAR size: $(du -h $JAR_FILE | cut -f1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload JAR to S3
        working-directory: backend
        run: |
          aws s3 cp target/tinambu-tours-lambda.jar \
            s3://${{ env.ASSETS_BUCKET }}/${{ env.LAMBDA_S3_KEY }}

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --s3-bucket ${{ env.ASSETS_BUCKET }} \
            --s3-key ${{ env.LAMBDA_S3_KEY }} \
            --no-cli-pager

      - name: Wait for Lambda update
        run: |
          echo "Waiting for Lambda function to be ready..."
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION }}
          echo "Lambda function updated successfully"

      - name: Summary
        run: |
          echo "### Backend deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Lambda: \`${{ env.LAMBDA_FUNCTION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Terraform — apply infrastructure changes (dev)
  # ──────────────────────────────────────────────
  deploy-infra:
    runs-on: ubuntu-latest
    name: Deploy Infrastructure
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve tfplan

      - name: Summary
        run: |
          echo "### Infrastructure deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
