server:
  port: 8080
  servlet:
    # context-path removed - API Gateway routes don't include /api prefix
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

spring:
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME:tinambu_tours}?useUnicode=true&characterEncoding=UTF-8&sslmode=require
    username: ${DB_USER:postgres}
    # Password será inyectada por SsmEnvironmentPostProcessor
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET client_encoding TO 'UTF8'
      connection-timeout: 60000  # 60 segundos (aumentado para Lambda cold start)
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000  # 5 minutos
      max-lifetime: 600000  # 10 minutos
  
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
  
  jpa:
    hibernate:
      ddl-auto: validate  # Cambiado de 'update' a 'validate' para evitar DDL durante inicialización en Lambda
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          useUnicode: true
          characterEncoding: UTF-8
          CharSet: UTF-8
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC
        default_schema: public
  
  security:
    jwt:
      secret: ${JWT_SECRET:your-super-secret-jwt-key-here-must-be-at-least-256-bits-long-for-security}
      expiration: 86400000 # 24 hours

logging:
  level:
    com.tinambu.tours: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: DEBUG
    org.hibernate: DEBUG
    root: ERROR

# CORS Configuration
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Google Places API Configuration
google:
  api:
    key: ${GOOGLE_API_KEY:}
    place-id: ${GOOGLE_PLACE_ID:}

# Facebook API Configuration
facebook:
  api:
    page-id: ${FACEBOOK_PAGE_ID:}
    access-token: ${FACEBOOK_ACCESS_TOKEN:}

# PlacetoPay Payment Gateway Configuration
placetopay:
  login: ${placetopay.login:}
  secret: ${placetopay.secret:}
  base-url: ${P2P_BASE_URL:https://checkout-test.placetopay.com}
  return-url: ${P2P_RETURN_URL:http://localhost:5173/pago/resultado}
  cancel-url: ${P2P_CANCEL_URL:http://localhost:5173/pago/cancelado}
  currency: ${P2P_CURRENCY:UYU}
