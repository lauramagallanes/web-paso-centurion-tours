server:
  port: 8080
  servlet:
    context-path: /api

spring:
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME:tinambu_tours}
    username: ${DB_USER:postgres}
    # Password será inyectada por SsmEnvironmentPostProcessor
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          useUnicode: true
          characterEncoding: UTF-8
          CharSet: UTF-8
  
  security:
    jwt:
      secret: ${JWT_SECRET:your-super-secret-jwt-key-here-must-be-at-least-256-bits-long-for-security}
      expiration: 86400000 # 24 hours

logging:
  level:
    com.tinambu.tours: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: DEBUG
    org.hibernate: DEBUG
    root: ERROR

# CORS Configuration
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
